    <!-- Google Fonts (display=swap avoids render-blocking) -->

    <style>
        :root {
            --brand-primary: #3d729a;
            --brand-dark: #0a2342;
            --brand-beige: #fdfaf6; 
            --brand-light-blue: #f4f8fb;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--brand-beige); 
            color: #1e293b;
            font-size: 20px;
            line-height: 1.8;
            scroll-behavior: smooth;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        p {
            text-align: justify;
            text-justify: inter-word;
            hyphens: auto;
            -webkit-hyphens: auto;
            word-break: break-word;
            line-height: 1.8;
        }

        @media (max-width: 768px) {
            body { font-size: 16px; }
        }
        
        h1, h2, h3, h4, h5, .serif, .font-serif {
            font-family: Cambria, Georgia, 'Times New Roman', serif;
            line-height: 1.2;
            font-style: normal;
        }

        .glass-morphism {
            background: rgba(253, 250, 246, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(15, 23, 42, 0.03);
        }
        
        .brand-gradient {
            background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-block;
        }
        
        .reveal {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 1.2s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }
        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .hover-underline { position: relative; }
        .hover-underline::after {
            content: '';
            position: absolute;
            width: 100%;
            height: 1px;
            bottom: -4px;
            left: 0;
            background-color: currentColor;
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .hover-underline:hover::after {
            transform: scaleX(1);
            transform-origin: left;
        }

        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-scroll {
            display: flex;
            width: max-content;
            animation: scroll 40s linear infinite;
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--brand-beige); }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--brand-primary); }

        .img-premium-hover {
            filter: grayscale(100%);
            transition: filter 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .img-premium-hover:hover {
            filter: grayscale(0%);
            transform: scale(1.03);
        }
    </style>
    <link rel="stylesheet" href="/index.css">
</head>
<body>
    <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
